<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>RunPod 직접 테스트</title>
<style>body{font-family:system-ui;padding:20px;max-width:640px;margin:auto}input,textarea,button{width:100%;padding:12px;margin:8px 0;font-size:16px}img,video{max-width:100%;margin-top:12px}#btn{background:#7c3aed;color:#fff;border:0;border-radius:8px;cursor:pointer}</style>
</head><body>
<h2>RunPod 직접 테스트 (Netlify 안 거침)</h2>
<p>RunPod API 키는 여기에만 적어. 코드에 안 저장돼.</p>
<input type="password" id="key" placeholder="RunPod API 키 붙여넣기 (rp_...)">
<input type="text" id="endpoint" placeholder="Endpoint ID (dq80...)">
<input type="file" id="file" accept="image/*">
<img id="preview" style="display:none">
<textarea id="prompt" rows="3">same girl, same face, same clothes, keep identity, do not change face, smiling and waving gently</textarea>
<button id="btn">RunPod 직접 부르기</button>
<p id="status">키랑 엔드포인트를 적고, 사진 올리고 버튼 눌러줘</p>
<video id="video" controls style="display:none"></video>
<script>
var imgBase64 = "";
document.getElementById("file").addEventListener("change", function(e){
  var f = e.target.files[0]; if(!f) return;
  document.getElementById("status").textContent = "사진 압축 중...";
  var r = new FileReader();
  r.onload = function(){
    var img = new Image();
    img.onload = function(){
      var max = 512; var w = img.width, h = img.height;
      if(w > max || h > max){ var s = Math.min(max/w, max/h); w = Math.round(w*s); h = Math.round(h*s); }
      var c = document.createElement("canvas"); c.width = w; c.height = h;
      c.getContext("2d").drawImage(img, 0, 0, w, h);
      imgBase64 = c.toDataURL("image/jpeg", 0.7);
      var p=document.getElementById("preview"); p.src=imgBase64; p.style.display="block";
      document.getElementById("status").textContent = "사진 준비됨 (" + Math.round(imgBase64.length/1024) + "KB)";
    };
    img.src = r.result;
  };
  r.readAsDataURL(f);
});
document.getElementById("btn").onclick = async function(){
  var st = document.getElementById("status");
  var key = document.getElementById("key").value.trim();
  var ep = document.getElementById("endpoint").value.trim();
  if(!key || !ep){ st.textContent="키랑 엔드포인트를 먼저 적어줘"; return; }
  if(!imgBase64){ st.textContent="사진을 먼저 올려줘"; return; }
  st.textContent = "RunPod에 직접 보내는 중...";
  var res = await fetch("https://api.runpod.ai/v2/" + ep + "/run", { method:"POST", headers:{"Content-Type":"application/json","Authorization":"Bearer "+key}, body: JSON.stringify({ input: { prompt: document.getElementById("prompt").value, image: imgBase64, seconds: 5 } }) });
  var data = await res.json();
  var id = data.id;
  if(!id){ st.textContent = "시작 실패: " + JSON.stringify(data).slice(0,500); return; }
  st.textContent = "시작됨! id: " + id + " — 10초마다 확인 중...";
  for(var i=0;i<30;i++){
    await new Promise(function(r){ setTimeout(r, 10000); });
    var s = await fetch("https://api.runpod.ai/v2/" + ep + "/status/" + id, { headers:{"Authorization":"Bearer "+key} });
    var sd = await s.json();
    st.textContent = "확인 " + (i+1) + "회 — 상태: " + sd.status;
    if(sd.status === "COMPLETED"){
      var out = sd.output; var url = typeof out === "string" ? out : (out && (out.video || out.url || out[0]));
      st.textContent = "완성! " + JSON.stringify(sd).slice(0,1000);
      if(url){ var v=document.getElementById("video"); v.src=url; v.style.display="block"; }
      return;
    }
    if(sd.status === "FAILED"){ st.textContent = "실패: " + JSON.stringify(sd).slice(0,1000); return; }
  }
};
</script></body></html>
