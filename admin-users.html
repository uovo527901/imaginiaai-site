<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>관리자 - 가입한 사람</title>
<style>
body { font-family: sans-serif; background: #f5f5f5; padding: 20px; color: #111; }
h1 { font-size: 24px; }
.card { background: #fff; border-radius: 12px; padding: 16px; margin: 12px 0; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
.email { font-size: 16px; font-weight: bold; }
.meta { font-size: 13px; color: #666; margin-top: 6px; }
button { padding: 12px 18px; background: #111; color: #fff; border: 0; border-radius: 8px; font-size: 15px; cursor: pointer; }
input { width: 100%; padding: 12px; margin: 8px 0; border: 1px solid #ddd; border-radius: 8px; font-size: 15px; box-sizing: border-box; }
#login-box { background: #fff; border-radius: 12px; padding: 20px; max-width: 400px; margin: 40px auto; }
#main-box { display: none; }
</style>
</head>
<body>

<div id="login-box">
<h1>관리자 로그인</h1>
<p style="font-size:14px;color:#555;">관리자 비밀번호를 입력해 주세요.</p>
<input id="admin-pw" type="password" placeholder="관리자 비밀번호" />
<button onclick="checkAdmin()">들어가기</button>
<p id="msg" style="font-size:13px;color:#e11d48;"></p>
</div>

<div id="main-box">
<h1>가입한 사람 목록</h1>
<p id="total">불러오는 중...</p>
<button onclick="loadUsers()">새로고침</button>
<button onclick="location.href='/'" style="background:#fff;color:#111;border:1px solid #ddd;">사이트로 돌아가기</button>
<div id="list"></div>
</div>

<script>
async function checkAdmin() {
  var pw = document.getElementById("admin-pw").value;
  if (!pw) {
    document.getElementById("msg").textContent = "비밀번호를 입력해 주세요.";
    return;
  }
  try {
    var res = await fetch("/.netlify/functions/actions", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ action: "admin.login", args: { password: pw } })
    });
    var data = await res.json();
    if (data.data && data.data.ok) {
      document.getElementById("login-box").style.display = "none";
      document.getElementById("main-box").style.display = "block";
      loadUsers();
    } else {
      document.getElementById("msg").textContent = "비밀번호가 틀렸어요.";
    }
  } catch (e) {
    // 테스트용 - 서버가 없으면, 일단 보여주기
    document.getElementById("login-box").style.display = "none";
    document.getElementById("main-box").style.display = "block";
    loadUsers();
  }
}

async function loadUsers() {
  document.getElementById("total").textContent = "불러오는 중...";
  try {
    var res = await fetch("/.netlify/functions/actions", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ action: "admin.list_users", args: {} })
    });
    var data = await res.json();
    var users = data.data.users || [];
    document.getElementById("total").textContent = "총 " + users.length + "명 가입했어요";
    var html = "";
    users.forEach(function (u) {
      var date = new Date(u.createdAt).toLocaleString("ko-KR");
      html += '<div class="card">'
        + '<div class="email">' + u.email + '</div>'
        + '<div class="meta">가입: ' + date + '</div>'
        + '<div class="meta">오늘 만든 횟수: ' + u.todayCount + '번 · 전체: ' + u.totalCount + '번</div>'
        + '</div>';
    });
    if (users.length === 0) {
      html = '<div class="card">아직 가입한 사람이 없어요.</div>';
    }
    document.getElementById("list").innerHTML = html;
  } catch (e) {
    document.getElementById("total").textContent = "불러오기 실패. 다시 해주세요.";
  }
}
</script>
</body>
</html>
