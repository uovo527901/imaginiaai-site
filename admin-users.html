<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>관리자 - 가입한 사람</title>
<style>
body { font-family: sans-serif; background: #f5f5f5; padding: 20px; color: #111; }
h1 { font-size: 24px; }
.card { background: #fff; border-radius: 12px; padding: 16px; margin: 12px 0; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
.email { font-size: 16px; font-weight: bold; }
.meta { font-size: 13px; color: #666; margin-top: 6px; }
button { padding: 12px 18px; background: #111; color: #fff; border: 0; border-radius: 8px; font-size: 15px; cursor: pointer; }
input { width: 100%; padding: 12px; margin: 8px 0; border: 1px solid #ddd; border-radius: 8px; font-size: 15px; box-sizing: border-box; }
#login-box { background: #fff; border-radius: 12px; padding: 20px; max-width: 400px; margin: 40px auto; }
#main-box { display: none; }
</style>
<link rel="stylesheet" href="/copy-protection.css">
<script src="/copy-protection.js" defer></script>
</head>
<body>

<div id="login-box">
<h1>관리자 로그인</h1>
<p style="font-size:14px;color:#555;">관리자 비밀번호를 입력해 주세요.</p>
<input id="admin-pw" type="password" placeholder="관리자 비밀번호" />
<button onclick="checkAdmin()">들어가기</button>
<p id="msg" style="font-size:13px;color:#e11d48;"></p>
</div>

<div id="main-box">
<h1>가입한 사람 목록</h1>
<p id="total">불러오는 중...</p>
<button onclick="loadUsers()">새로고침</button>
<button onclick="location.href='/'" style="background:#fff;color:#111;border:1px solid #ddd;">사이트로 돌아가기</button>
<a href="/kling/">Kling Studio ↗</a>
<div id="list"></div>
</div>

<script>
async function requestAdmin(action, args) {
  let response;
  try {
    response = await fetch("/.netlify/functions/actions", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ action, args })
    });
  } catch {
    return { error: "서버에 연결이 안 돼요." };
  }
  const data = await response.json().catch(() => null);
  if (data?.error) return { status: response.status, error: data.error };
  if (!response.ok || data?.ok !== true) {
    return { status: response.status, error: "서버 응답을 확인할 수 없어요." };
  }
  return { status: response.status, data };
}

async function checkAdmin() {
  const input = document.getElementById("admin-pw");
  const message = document.getElementById("msg");
  if (!input.value) {
    message.textContent = "비밀번호를 입력해 주세요.";
    return;
  }
  const { error } = await requestAdmin("admin.login", { password: input.value });
  if (error) {
    message.textContent = error;
    return;
  }
  input.value = "";
  message.textContent = "";
  await loadUsers();
}

async function loadUsers({ silentUnauthorized = false } = {}) {
  const login = document.getElementById("login-box");
  const main = document.getElementById("main-box");
  const total = document.getElementById("total");
  const list = document.getElementById("list");
  const showError = (error) => {
    if (main.style.display === "block") total.textContent = error;
    else {
      document.getElementById("msg").textContent = error;
      login.hidden = false;
    }
  };
  total.textContent = "불러오는 중...";
  const { status, data, error } = await requestAdmin("admin.list_users", {});
  if (status === 401) {
    main.style.display = "none";
    list.replaceChildren();
    login.hidden = false;
    if (silentUnauthorized) return;
  }
  if (error) {
    showError(error);
    return;
  }
  try {
    const { data: { users } } = data;
    login.hidden = true;
    main.style.display = "block";
    total.textContent = "총 " + users.length + "명 가입했어요";
    list.replaceChildren();
    users.forEach(function (user) {
      const card = document.createElement("div");
      card.className = "card";
      const fields = [
        ["email", user.email],
        ["meta", "가입: " + new Date(user.createdAt).toLocaleString("ko-KR")],
        ["meta", "오늘 만든 횟수: " + user.todayCount + "번 · 전체: " + user.totalCount + "번"]
      ];
      fields.forEach(function ([className, text]) {
        const detail = document.createElement("div");
        detail.className = className;
        detail.textContent = text;
        card.append(detail);
      });
      list.append(card);
    });
    if (users.length === 0) {
      const card = document.createElement("div");
      card.className = "card";
      card.textContent = "아직 가입한 사람이 없어요.";
      list.append(card);
    }
  } catch {
    showError("불러오기 실패. 다시 해주세요.");
  }
}

loadUsers({ silentUnauthorized: true });
</script>
</body>
</html>
