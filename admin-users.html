<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title data-i18n="memberManagement"></title>
<style>
body { font-family: sans-serif; background: #f5f5f5; padding: 20px; color: #111; }
h1 { font-size: 24px; }
.card { background: #fff; border-radius: 12px; padding: 16px; margin: 12px 0; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
.email { font-size: 16px; font-weight: bold; }
.meta { font-size: 13px; color: #666; margin-top: 6px; }
button { padding: 12px 18px; background: #111; color: #fff; border: 0; border-radius: 8px; font-size: 15px; cursor: pointer; }
input { width: 100%; padding: 12px; margin: 8px 0; border: 1px solid #ddd; border-radius: 8px; font-size: 15px; box-sizing: border-box; }
#login-box { background: #fff; border-radius: 12px; padding: 20px; max-width: 400px; margin: 40px auto; }
#main-box { display: none; }
</style>
</head>
<body>

<div id="login-box">
<h1 data-i18n="adminLogin"></h1>
<p data-i18n="adminPasswordDescription" style="font-size:14px;color:#555;"></p>
<input id="admin-pw" type="password" data-i18n-placeholder="adminPassword" />
<button onclick="checkAdmin()" data-i18n="adminEnter"></button>
<p id="msg" style="font-size:13px;color:#e11d48;"></p>
</div>

<div id="main-box">
<h1 data-i18n="userList"></h1>
<p id="total"></p>
<button onclick="loadUsers()" data-i18n="refresh"></button>
<button onclick="location.href='/'" data-i18n="backToSite" style="background:#fff;color:#111;border:1px solid #ddd;"></button>
<div id="list"></div>
</div>

<script src="/i18n.js"></script>
<script>
var i18n = window.ImaginiaI18n;
i18n.apply();

async function checkAdmin() {
  var pw = document.getElementById("admin-pw").value;
  if (!pw) {
    i18n.setText(document.getElementById("msg"), "adminPasswordRequired");
    return;
  }
  try {
    var res = await fetch("/.netlify/functions/actions", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ action: "admin.login", args: { password: pw } })
    });
    var data = await res.json();
    if (data.data && data.data.ok) {
      document.getElementById("login-box").style.display = "none";
      document.getElementById("main-box").style.display = "block";
      loadUsers();
    } else {
      i18n.setText(document.getElementById("msg"), "adminPasswordWrong");
    }
  } catch (e) {
    // 테스트용 - 서버가 없으면, 일단 보여주기
    document.getElementById("login-box").style.display = "none";
    document.getElementById("main-box").style.display = "block";
    loadUsers();
  }
}

async function loadUsers() {
  var total = document.getElementById("total");
  i18n.setText(total, "loading");
  try {
    var res = await fetch("/.netlify/functions/actions", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ action: "admin.list_users", args: {} })
    });
    var data = await res.json();
    var users = data.data.users || [];
    i18n.setText(total, "userTotal", { count: users.length });
    var list = document.createDocumentFragment();
    function addText(parent, className, text) {
      var element = document.createElement("div");
      element.className = className;
      element.textContent = text;
      parent.appendChild(element);
      return element;
    }
    users.forEach(function (u) {
      var date = new Date(u.createdAt).toLocaleString(i18n.getLanguage());
      var card = addText(list, "card", "");
      addText(card, "email", u.email);
      addText(card, "meta", i18n.translate("userDate", { date: date }));
      addText(card, "meta", i18n.translate("userCounts", { today: u.todayCount, total: u.totalCount }));
    });
    if (users.length === 0) {
      addText(list, "card", i18n.translate("noUsers"));
    }
    document.getElementById("list").replaceChildren(list);
  } catch (e) {
    i18n.setText(total, "usersFailed");
  }
}
</script>
</body>
</html>
