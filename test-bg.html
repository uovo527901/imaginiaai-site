<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Background 테스트</title>
<style>body{font-family:system-ui;padding:20px;max-width:640px;margin:auto}input,textarea,button{width:100%;padding:12px;margin:8px 0;font-size:16px}img,video{max-width:100%;margin-top:12px}#btn{background:#7c3aed;color:#fff;border:0;border-radius:8px;cursor:pointer}</style>
</head><body>
<h2>Background 함수 테스트 (API 키 숨김)</h2>
<input type="file" id="file" accept="image/*">
<img id="preview" style="display:none">
<textarea id="prompt" rows="3">same girl, same face, same clothes, keep identity, do not change face, smiling and waving gently</textarea>
<button id="btn">Background로 영상 만들기</button>
<p id="status">사진 올리고 버튼 눌러줘</p>
<video id="video" controls style="display:none"></video>
<script>
var imgBase64 = "";
document.getElementById("file").addEventListener("change", function(e){
  var f = e.target.files[0]; if(!f) return;
  document.getElementById("status").textContent = "사진 압축 중...";
  var r = new FileReader();
  r.onload = function(){
    var img = new Image();
    img.onload = function(){
      var max = 512; var w = img.width, h = img.height;
      if(w > max || h > max){ var s = Math.min(max/w, max/h); w = Math.round(w*s); h = Math.round(h*s); }
      var c = document.createElement("canvas"); c.width = w; c.height = h;
      c.getContext("2d").drawImage(img, 0, 0, w, h);
      imgBase64 = c.toDataURL("image/jpeg", 0.7);
      var p=document.getElementById("preview"); p.src=imgBase64; p.style.display="block";
      document.getElementById("status").textContent = "사진 준비됨 (" + Math.round(imgBase64.length/1024) + "KB)";
    };
    img.src = r.result;
  };
  r.readAsDataURL(f);
});
document.getElementById("btn").onclick = async function(){
  var st = document.getElementById("status");
  if(!imgBase64){ st.textContent="사진을 먼저 올려줘"; return; }
  st.textContent = "Background 함수 부르는 중...";
  var res = await fetch("/.netlify/functions/runpod-generate-background", { method:"POST", headers:{"Content-Type":"application/json"}, body: JSON.stringify({ prompt: document.getElementById("prompt").value, image: imgBase64, seconds: 5 }) });
  var txt = await res.text();
  st.textContent = "결과: " + txt.slice(0,500);
  try {
    var data = JSON.parse(txt);
    var id = data.id;
    if(!id){ st.textContent = "시작 실패: " + txt.slice(0,500); return; }
    st.textContent = "시작됨! id: " + id + " — 10초마다 확인 중...";
    for(var i=0;i<30;i++){
      await new Promise(function(r){ setTimeout(r, 10000); });
      var s = await fetch("/actions", { method:"POST", headers:{"Content-Type":"application/json"}, body: JSON.stringify({ action: "runpod.status", args: { id: id } }) });
      var sd = await s.json();
      var status = sd.data && sd.data.status;
      st.textContent = "확인 " + (i+1) + "회 — 상태: " + status;
      if(status === "COMPLETED"){
        var out = sd.data.output; var url = null;
        if(typeof out === "string") url = out;
        else if(out && out.data_b64) url = "data:" + (out.content_type || "video/mp4") + ";base64," + out.data_b64;
        else if(out) url = out.video || out.url || out[0];
        st.textContent = "완성! 영상 아래에 나와";
        if(url){ var v=document.getElementById("video"); v.src=url; v.style.display="block"; v.play(); }
        return;
      }
      if(status === "FAILED"){ st.textContent = "실패: " + JSON.stringify(sd.data).slice(0,500); return; }
    }
  } catch(e){ st.textContent = "에러: " + e.message; }
};
</script></body></html>
